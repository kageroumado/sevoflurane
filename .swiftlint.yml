# Lint only first-party sources; never the build output or generated files.
included:
  - Sevoflurane
  - SevofluraneDaemon
  - SevofluraneTests
  - SevofluraneThumbnail
  - Shared

excluded:
  - build
  - DerivedData
  - .build
  - .swiftpm

disabled_rules:
  # Formatting handled by SwiftFormat
  - trailing_whitespace
  - trailing_comma

  # Too restrictive for this codebase
  - identifier_name
  - type_name
  - large_tuple
  - nesting
  - for_where
  - implicit_optional_initialization
  - type_body_length

  # Conflicts with SwiftUI idioms
  - multiple_closures_with_trailing_closure

  # Structure is owned by SwiftFormat; the over-long lines left are content — UI copy, log
  # messages, and injected JavaScript — which read worse broken mid-sentence.
  - line_length

  # Subprocess output (pgrep, lsof) is decoded with `String(decoding:as:)` — the right tool for a
  # lossy, never-nil decode of bytes we don't control. The suggested failable initializer is the
  # wrong choice here, so silence this rule rather than fight it.
  - optional_data_string_conversion

# force_try / force_cast are legitimate signals but often intentional in tests (bundled-resource
# decode, fixtures) — keep them visible as warnings rather than CI-blocking errors.
force_try:
  severity: warning
force_cast:
  severity: warning

# Length limits adjusted for codebase complexity
file_length:
  warning: 1000
  error: 1200

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 15
  error: 25

function_parameter_count:
  warning: 6
  error: 8

indentation: 4

custom_rules:
  # A Settings `List` is a flat sidebar of one kind of row. A `Section` header
  # row beside content rows makes AppKit's table constrain a header row view
  # against a content row view across a diff, and the recycled row is pinned to
  # an anchor in a hierarchy it has already left — an AutoLayout exception
  # raised inside the display cycle, which AppKit turns into a crash. Panes are
  # `Form` with `.formStyle(.grouped)`; see CONTRIBUTING.md.
  #
  # The match is file-wide rather than brace-accurate: in these files the only
  # `List` is the sidebar, so a `Section` anywhere below one is the defect.
  settings_list_section:
    name: "Section inside a Settings List"
    included: ".*/Sevoflurane/App/Settings.*\\.swift"
    regex: 'List\s*[({].*?\bSection\s*[{(]'
    message: "A Settings List must stay a flat sidebar — use Form + .formStyle(.grouped) for grouped content."
    severity: error
