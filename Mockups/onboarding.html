<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sevoflurane — onboarding wizard mockup</title>
<style>
  :root {
    --ground: #FAF6EC; --panel: #FFFFFF; --panel-2: #F3EDDC;
    --ink: #1E180C; --ink-2: #6F6549; --ink-3: #9E9377; --hair: #E7DEC6;
    --accent: #EDB63B; --accent-ink: #271D06; --accent-text: #99720A; --accent-soft: #F9EBC8;
    --good: #2E9E74; --warn: #C98A1E; --crit: #C24C42;
    --mat: #EAE2CB; --bar-track: #EDE6D2;
    --shadow: 0 1px 2px rgba(50,38,8,.06), 0 14px 44px rgba(60,45,10,.12);
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14110A; --panel: #1C1810; --panel-2: #241F14;
      --ink: #F2ECDC; --ink-2: #B3A784; --ink-3: #7E7458; --hair: #352E1D;
      --accent: #F5C64F; --accent-ink: #271D06; --accent-text: #F5C64F; --accent-soft: #3A2F12;
      --good: #4CC49A; --warn: #E3AA45; --crit: #E5695F;
      --mat: #0D0B06; --bar-track: #2E281A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --ground: #14110A; --panel: #1C1810; --panel-2: #241F14;
    --ink: #F2ECDC; --ink-2: #B3A784; --ink-3: #7E7458; --hair: #352E1D;
    --accent: #F5C64F; --accent-ink: #271D06; --accent-text: #F5C64F; --accent-soft: #3A2F12;
    --good: #4CC49A; --warn: #E3AA45; --crit: #E5695F;
    --mat: #0D0B06; --bar-track: #2E281A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 50px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--mat); color: var(--ink); font-family: var(--font-ui);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 48px; gap: 20px;
  }
  /* ---- editor rail (not part of the product) ---- */
  .rail { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .rail-label { font-size: 12px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
  .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--hair); border-radius: 8px; padding: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 12.5px;
    padding: 5px 11px; border-radius: 6px; cursor: pointer;
  }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  /* ---- the window ---- */
  .window {
    width: 680px; max-width: 100%; background: var(--panel); border-radius: 12px;
    box-shadow: var(--shadow); border: 1px solid var(--hair); overflow: hidden;
  }
  .titlebar { display: flex; align-items: center; gap: 8px; padding: 13px 14px; }
  .light { width: 12px; height: 12px; border-radius: 50%; background: var(--bar-track); }
  .titlebar .close { background: #EC6A5E; } .titlebar .min { background: #F5BF4F; } .titlebar .zoom { background: #61C554; }
  .body { padding: 8px 44px 36px; min-height: 380px; display: flex; flex-direction: column; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 8px; }
  .lede { color: var(--ink-2); font-size: 14px; line-height: 1.5; max-width: 46ch; }
  .content { flex: 1; padding-top: 22px; }
  /* choice cards */
  .choice { border: 1.5px solid var(--hair); border-radius: 10px; padding: 14px 16px; display: flex; gap: 12px; cursor: pointer; }
  .choice + .choice { margin-top: 10px; }
  .choice.sel { border-color: var(--accent); background: var(--accent-soft); }
  .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink-3); margin-top: 2px; flex: none; background: var(--panel); }
  .choice.sel .radio { border: 5px solid var(--accent); }
  .choice b { font-size: 14px; }
  .choice .sub { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; margin-top: 3px; }
  .tag { font-size: 11px; color: var(--accent-text); background: var(--accent-soft); border-radius: 5px; padding: 2px 7px; margin-left: 8px; vertical-align: 1px; }
  .choice.sel .tag { background: var(--panel); }
  details { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); }
  summary { cursor: pointer; color: var(--accent-text); font-size: 13px; }
  details p { margin-top: 8px; line-height: 1.55; max-width: 54ch; }
  /* status rows (detection / progress) */
  .rows { border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 11px; padding: 11px 14px; font-size: 13.5px; }
  .row + .row { border-top: 1px solid var(--hair); }
  .row .st { width: 17px; text-align: center; flex: none; }
  .st.ok { color: var(--good); } .st.run { color: var(--accent-text); } .st.todo { color: var(--ink-3); } .st.warn { color: var(--warn); }
  .row .d { color: var(--ink-3); margin-left: auto; font-size: 12px; font-family: var(--font-data); }
  .bar { height: 4px; background: var(--bar-track); border-radius: 2px; overflow: hidden; margin: 14px 2px 0; }
  .bar i { display: block; height: 100%; width: 46%; background: var(--accent); border-radius: 2px; }
  .note { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .note b { color: var(--warn); }
  /* sign-in placeholder */
  .steam-login { border: 1px dashed var(--hair); border-radius: 10px; padding: 34px 20px; text-align: center; color: var(--ink-2); font-size: 13px; background: var(--panel-2); }
  .steam-login .big { font-size: 15px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
  /* options toggles */
  .opt { display: flex; align-items: center; gap: 14px; padding: 13px 2px; }
  .opt + .opt { border-top: 1px solid var(--hair); }
  .opt b { font-size: 14px; font-weight: 600; }
  .opt .sub { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; line-height: 1.4; }
  .switch { margin-left: auto; flex: none; width: 40px; height: 24px; border-radius: 12px; background: var(--bar-track); position: relative; cursor: pointer; }
  .switch.on { background: var(--accent); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
  .switch.on::after { left: 18px; }
  /* footer */
  .footer { display: flex; align-items: center; padding-top: 26px; }
  .dots { display: flex; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bar-track); }
  .dot.on { background: var(--accent); }
  .btns { margin-left: auto; display: flex; gap: 10px; }
  button.primary, button.ghost {
    font: inherit; font-size: 13.5px; font-weight: 600; border-radius: 8px; padding: 8px 18px; cursor: pointer; border: 1px solid transparent;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--ink-2); border-color: var(--hair); }
  .done-mark { font-size: 40px; color: var(--good); margin-bottom: 14px; }
  .caption { font-size: 12px; color: var(--ink-3); max-width: 640px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <div class="rail">
    <span class="rail-label">Scenario</span>
    <div class="seg" id="scenarios"></div>
    <span class="rail-label">Theme</span>
    <div class="seg" id="themes">
      <button data-t="system">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button>
    </div>
  </div>

  <div class="window">
    <div class="titlebar"><span class="light close"></span><span class="light min"></span><span class="light zoom"></span></div>
    <div class="body" id="body"></div>
  </div>
  <p class="caption">Mockup of the first-run assistant (<code>Docs/onboarding-spec.md</code>). The scenario picker
  simulates what SevoKit detection finds on the user's machine; every screen below is driven from that one state.
  On the happy path the user clicks Continue four times and never chooses anything.</p>

<script>
"use strict";
// ---- one data model; every screen renders from it ----
const SCENARIOS = {
  clean:    { label: "Clean Mac",            crossover: null,                                    steamBottle: false },
  licensed: { label: "CrossOver licensed",   crossover: { version: "26.3", licensed: true  },    steamBottle: false },
  expired:  { label: "CrossOver trial ended",crossover: { version: "26.3", licensed: false },    steamBottle: false },
  existing: { label: "Existing Steam bottle",crossover: { version: "26.3", licensed: true  },    steamBottle: true  },
};
const state = { scenario: "clean", step: 0, engine: null, opts: { login: true, warm: true, update: true } };

const stepsFor = (sc) => {
  const s = ["welcome"];
  if (!(sc.crossover && sc.crossover.licensed)) s.push("engine");
  s.push("steam", "signin", "options", "done");
  return s;
};

function render() {
  const sc = SCENARIOS[state.scenario];
  const steps = stepsFor(sc);
  if (state.step >= steps.length) state.step = steps.length - 1;
  const step = steps[state.step];
  document.getElementById("body").innerHTML = SCREENS[step](sc);
  // scenario segs
  document.getElementById("scenarios").innerHTML = Object.entries(SCENARIOS)
    .map(([k, v]) => `<button data-s="${k}" class="${k === state.scenario ? "on" : ""}">${v.label}</button>`).join("");
  // footer dots reflect position
  const dots = document.querySelector(".dots");
  if (dots) dots.innerHTML = steps.map((_, i) => `<div class="dot ${i <= state.step ? "on" : ""}"></div>`).join("");
}

const footer = (primary, backable = true) => `
  <div class="footer">
    <div class="dots"></div>
    <div class="btns">
      ${backable ? `<button class="ghost" onclick="go(-1)">Back</button>` : ""}
      <button class="primary" onclick="go(1)">${primary}</button>
    </div>
  </div>`;

const SCREENS = {
  welcome: (sc) => `
    <div class="content" style="display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center">
      <div style="width:76px;height:76px;border-radius:18px;background:var(--accent);margin-bottom:20px;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:34px;font-weight:800">S</div>
      <h1>Welcome to Sevoflurane</h1>
      <p class="lede">Your Steam library, native on the Mac. Setup takes a few
      minutes and runs by itself — you'll sign in to Steam once at the end.</p>
    </div>
    ${footer("Get Started", false)}`,

  engine: (sc) => {
    const cxExpired = sc.crossover && !sc.crossover.licensed;
    return `
    <div class="content">
      <h1>One thing to install</h1>
      <p class="lede">Sevoflurane needs a compatibility layer to run Steam's
      Windows catalog on your Mac.</p>
      ${cxExpired ? `<p class="note"><b>CrossOver ${sc.crossover.version} is installed, but its trial has ended.</b>
        You can keep using it by buying a license, or use the built-in engine — your choice below.</p>` : ""}
      <div style="margin-top:18px">
        <div class="choice ${state.engine !== "crossover" ? "sel" : ""}" onclick="pick('builtin')">
          <div class="radio"></div>
          <div><b>Built-in engine</b><span class="tag">Free · Recommended</span>
            <div class="sub">A ~190 MB download, managed and updated by Sevoflurane. Runs most games well.</div>
          </div>
        </div>
        <div class="choice ${state.engine === "crossover" ? "sel" : ""}" onclick="pick('crossover')">
          <div class="radio"></div>
          <div><b>CrossOver</b><span class="tag">$74 · 14-day free trial</span>
            <div class="sub">${cxExpired ? "Buy a license at codeweavers.com to keep using your existing install."
              : "Commercial engine by CodeWeavers. Opens codeweavers.com; come back when it's installed."}</div>
          </div>
        </div>
      </div>
      <details><summary>Why would I pay for CrossOver?</summary>
        <p>CodeWeavers employs the developers of the open-source technology both
        engines are built on. CrossOver ships game-specific fixes months earlier,
        its Apple-GPU graphics path is better tuned, and buying it funds the whole
        ecosystem. The built-in engine shares the same core and is fine for most
        titles — and you can switch engines later in Settings without redoing setup.</p>
      </details>
    </div>
    ${footer(state.engine === "crossover" ? "Open codeweavers.com" : "Install & Continue")}`;
  },

  steam: (sc) => sc.steamBottle ? `
    <div class="content">
      <h1>Found your Steam</h1>
      <p class="lede">You already have Steam installed${sc.crossover ? " in CrossOver" : ""}.
      Sevoflurane will connect to it — your games and saves stay exactly where they are.</p>
      <div class="rows" style="margin-top:20px">
        <div class="row"><span class="st ok">✓</span> Steam found <span class="d">bottle “Steam” · 431 games · 268 GB</span></div>
        <div class="row"><span class="st ok">✓</span> Configured for background use <span class="d">2s</span></div>
        <div class="row"><span class="st run">◐</span> Checking for Steam updates… <span class="d">–</span></div>
      </div>
    </div>
    ${footer("Continue")}` : `
    <div class="content">
      <h1>Setting up Steam</h1>
      <p class="lede">Downloading and installing the Steam client. This is the
      longest step — a few minutes on most connections.</p>
      <div class="rows" style="margin-top:20px">
        <div class="row"><span class="st ok">✓</span> Environment created <span class="d">14s</span></div>
        <div class="row"><span class="st ok">✓</span> Steam installer <span class="d">3 MB</span></div>
        <div class="row"><span class="st run">◐</span> Downloading Steam… <span class="d">312 / 680 MB</span></div>
        <div class="row"><span class="st todo">○</span> First launch <span class="d">–</span></div>
      </div>
      <div class="bar"><i></i></div>
      <p class="note">You can close this window — setup continues in the menu bar
      and picks up where it left off if interrupted.</p>
    </div>
    ${footer("Continue")}`,

  signin: () => `
    <div class="content">
      <h1>Sign in to Steam</h1>
      <p class="lede">This is Steam's own sign-in — Sevoflurane never sees your
      password. Use the QR code with the Steam mobile app, or your password
      and Steam Guard.</p>
      <div class="steam-login" style="margin-top:20px">
        <div class="big">Steam sign-in window</div>
        Steam's real login UI renders here, natively (the adopted
        <span style="font-family:var(--font-data)">SP DesktopLoginWindow</span> popup).
      </div>
    </div>
    ${footer("Continue")}`,

  options: () => `
    <div class="content">
      <h1>A few preferences</h1>
      <p class="lede">All of these can be changed later in Settings.</p>
      <div style="margin-top:14px">
        <div class="opt"><div><b>Open at login</b><div class="sub">Sevoflurane starts in the menu bar. No windows until you ask.</div></div>
          <div class="switch ${state.opts.login ? "on" : ""}" onclick="tog('login')"></div></div>
        <div class="opt"><div><b>Keep Steam ready</b><div class="sub">Runs Steam quietly in the background so your library opens instantly and games stay updated.</div></div>
          <div class="switch ${state.opts.warm ? "on" : ""}" onclick="tog('warm')"></div></div>
        <div class="opt"><div><b>Update automatically</b><div class="sub">Sevoflurane keeps itself up to date.</div></div>
          <div class="switch ${state.opts.update ? "on" : ""}" onclick="tog('update')"></div></div>
      </div>
    </div>
    ${footer("Finish")}`,

  done: () => `
    <div class="content" style="display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center">
      <div class="done-mark">✓</div>
      <h1>Ready to play</h1>
      <p class="lede">Your library is in the menu bar — the yellow glyph, top
      right. Enjoy.</p>
    </div>
    <div class="footer"><div class="dots"></div><div class="btns">
      <button class="primary" onclick="state.step=0;render()">Open My Library</button></div></div>`,
};

function go(d) { state.step += d; render(); }
function pick(e) { state.engine = e === "crossover" ? "crossover" : null; render(); }
function tog(k) { state.opts[k] = !state.opts[k]; render(); }
document.getElementById("scenarios").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-s]");
  if (b) { state.scenario = b.dataset.s; state.step = 0; state.engine = null; render(); }
});
document.getElementById("themes").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-t]");
  if (!b) return;
  document.querySelectorAll("#themes button").forEach((x) => x.classList.toggle("on", x === b));
  const t = b.dataset.t;
  if (t === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
});
render();
</script>
</body>
</html>
